name: Probe CCGP Access

on:
  workflow_dispatch:
  pull_request:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe official list pages
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import requests
          from ccgp.config import USER_AGENT
          from ccgp.parse_index import parse_list_page
          from ccgp.tools import http_get

          session = requests.Session()
          session.headers.update({
              "User-Agent": USER_AGENT,
              "Accept-Language": "zh-CN,zh;q=0.9",
          })
          for path in ("dfgg", "zygg"):
              for scheme in ("https", "http"):
                  url = f"{scheme}://www.ccgp.gov.cn/cggg/{path}/gkzb/index.htm"
                  try:
                      html = http_get(url, session, timeout=20, max_retries=1)
                      entries = parse_list_page(html, url) or []
                      print(f"PROBE {url} entries={len(entries)}")
                  except Exception as exc:
                      print(f"PROBE {url} error={type(exc).__name__}: {exc}")
          PY
