name: Daily Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"  # 每天北京时间 04:00（UTC 20:00）

permissions:
  contents: write

concurrency:
  group: ccgp-daily-collection
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: 'Asia/Shanghai'
      CCGP_ENABLE_ATTACHMENTS: "true"
      CCGP_ENABLE_LLM: "true"
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      VOLC_API_KEY: ${{ secrets.VOLC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CCGP_HTTP_TIMEOUT: "30"
      CCGP_DOWNLOAD_TIMEOUT: "45"
      CCGP_MAX_ATTACHMENTS: "2"
      CCGP_SLEEP_MIN: "1.0"
      CCGP_SLEEP_MAX: "3.0"
      CCGP_SEARCH_PAGE_SLEEP_MIN: "15"
      CCGP_SEARCH_PAGE_SLEEP_MAX: "30"
      CCGP_SEARCH_KEYWORD_SLEEP_MIN: "30"
      CCGP_SEARCH_KEYWORD_SLEEP_MAX: "60"
      CCGP_SEARCH_COOLDOWN_SCHEDULE: "300,900,1800,3600"
      CCGP_TIME_BUDGET_SEC: "20400"
      CCGP_SKIP_REPEAT_FAILED_ATTACHMENTS: "true"
      AMAP_GEOCODING_KEY: ${{ secrets.AMAP_GEOCODING_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python src/ccgp_collect.py --days 1

      - name: Commit collection progress
        if: always() && github.ref_name == 'main'
        run: |
          git config user.name "youngfish42"
          git config user.email "youngfish42@users.noreply.github.com"
          git add src/ccgp/data/tender_items.csv
          if [ -f src/ccgp/data/collection_checkpoint.json ]; then
            git add src/ccgp/data/collection_checkpoint.json
          fi
          if git diff --cached --quiet; then
            echo "No collection progress to commit."
          else
            git commit -m "chore: update collection progress"
            git status --porcelain
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccgp-logs-${{ github.run_id }}
          path: src/ccgp/data/logs/
          if-no-files-found: warn

      - name: Upload filter trace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccgp-filter-trace-${{ github.run_id }}
          path: src/ccgp/data/filter_trace/
          if-no-files-found: warn

